name: Zoek producten op bij Picnic

# Stap 1 van 2 bij bestellen via de website: zoekt voor elk product in
# boodschappenlijst.txt wat Picnic aanbiedt (zonder iets te bestellen) en
# schrijft dat weg naar product_voorstellen.json, zodat je op de website
# kan controleren/kiezen vóórdat er echt besteld wordt. Wordt alleen door
# de website zelf aangeroepen (via "Zoek producten op").

on:
  workflow_dispatch:
    inputs:
      losse_zoekterm:
        description: >
          Optioneel: zoek alleen naar deze ene term (voor "ander product
          zoeken" op het controlescherm) i.p.v. de hele boodschappenlijst.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  zoeken:
    runs-on: ubuntu-latest
    steps:
      - name: Repo ophalen
        uses: actions/checkout@v4

      - name: Python 3.13 installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Producten opzoeken bij Picnic
        env:
          PICNIC_SESSION_TOKEN: ${{ secrets.PICNIC_SESSION_TOKEN }}
          LOSSE_ZOEKTERM: ${{ github.event.inputs.losse_zoekterm }}
        run: |
          if [ -n "$LOSSE_ZOEKTERM" ]; then
            python3 picnic_boodschappen.py --losse-zoekterm "$LOSSE_ZOEKTERM"
          else
            python3 picnic_boodschappen.py --voorbeeld
          fi

      - name: Voorstellen terugzetten in de repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product_voorstellen.json losse_zoekresultaten.json
          git diff --staged --quiet || git commit -m "Productvoorstellen bijgewerkt"
          git push
