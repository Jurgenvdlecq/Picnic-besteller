name: Bestel bij Picnic

# Twee manieren om hier terecht te komen, zodat je geen Mac nodig hebt:
#   1. Automatisch elke zondagochtend (zie de cron hieronder). Dit plaatst
#      BEWUST nooit zelf blind een nieuwe, ongecontroleerde bestelling — de
#      cron controleert alleen of je deze week al zelf op "Definitief
#      bestellen" op de website hebt gedrukt. Is dat zo, dan is er niets te
#      doen (die bestelling is al geplaatst). Is dat niet zo, dan wordt er
#      alleen een GitHub Issue als herinnering aangemaakt — geen bestelling.
#   2. Handmatig vanaf je telefoon: open de GitHub-app (of github.com in
#      Safari) -> deze repo -> tabblad "Actions" -> "Bestel bij Picnic" ->
#      "Run workflow". Dat is de enige manier waarop deze workflow zelf
#      ooit een bestelling plaatst zonder dat je eerst via de website op
#      "Definitief bestellen" hebt gedrukt — een bewuste, handmatige actie.
#
# Voorwaarde: de secret PICNIC_SESSION_TOKEN moet gezet zijn (Settings ->
# Secrets and variables -> Actions). Zie picnic_stap_voor_stap_gids.md voor
# hoe je die eenmalig ophaalt (dat vereist één keer inloggen incl. 2FA,
# want dat kan niet headless in de cloud).

on:
  workflow_dispatch:
    inputs:
      nieuw_weekmenu:
        description: "Eerst een nieuw weekmenu kiezen (ja) of de huidige boodschappenlijst.txt gebruiken zoals die in de repo staat (nee)?"
        required: true
        default: "ja"
        type: choice
        options:
          - "ja"
          - "nee"
  schedule:
    # 07:00 UTC ~ 08:00/09:00 Nederlandse tijd (afhankelijk van zomer/wintertijd).
    - cron: "0 7 * * 0"

permissions:
  contents: write
  issues: write

jobs:
  bestellen:
    runs-on: ubuntu-latest
    steps:
      - name: Repo ophalen
        uses: actions/checkout@v4

      - name: Python 3.13 installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Check of deze week al bevestigd is (alleen bij de zondag-cron)
        if: ${{ github.event_name == 'schedule' }}
        id: check
        run: |
          BEVESTIGD=$(python3 picnic_boodschappen.py --toon-bevestigd-deze-week)
          echo "bevestigd=$BEVESTIGD" >> "$GITHUB_OUTPUT"

      - name: Herinnering sturen (nog niet bevestigd deze week)
        if: ${{ github.event_name == 'schedule' && steps.check.outputs.bevestigd == 'nee' }}
        uses: actions/github-script@v7
        with:
          script: |
            const datum = new Date().toLocaleDateString("nl-NL", { day: "numeric", month: "long" });
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nog niet bevestigd — controleer je bestelling (${datum})`,
              body: [
                "Er is deze week nog geen bestelling bevestigd via de website.",
                "",
                "Er wordt NIET automatisch besteld: open de website, controleer het weekmenu/de boodschappenlijst en druk zelf op \"Definitief bestellen bij Picnic\" als het klopt.",
                "",
                "_Automatisch aangemaakt door de zondag-check. Sluit dit issue als je klaar bent._",
              ].join("\n"),
            });

      - name: Weekmenu kiezen
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.nieuw_weekmenu == 'ja' }}
        run: python3 weekmenu.py --automatisch

      - name: Bestellen bij Picnic
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          PICNIC_SESSION_TOKEN: ${{ secrets.PICNIC_SESSION_TOKEN }}
        run: python3 picnic_boodschappen.py --automatisch

      - name: Wijzigingen terugzetten in de repo
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boodschappenlijst.txt weekmenu_geschiedenis.txt laatste_bestelling.json gekozen_producten.json product_voorkeuren.json
          git diff --staged --quiet || git commit -m "Automatische bestelling: weekmenu en boodschappenlijst bijgewerkt"
          git push
